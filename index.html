<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Perpustakaan Digital - Vicky Server</title>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
		<link
			href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body class="dark">
		<!-- Header/Navbar -->
		<header>
			<div class="nav-left">
				<button class="btn-nav" id="btn-back" style="display: none">
					<i class="fas fa-arrow-left"></i>
					<span class="text">Kembali</span>
				</button>
				<h1 class="page-title" id="page-title">Perpustakaan Digital</h1>
			</div>
			<div class="nav-right">
				<button class="btn-nav" id="btn-theme">
					<i class="fas fa-moon"></i>
					<span class="text">Mode Gelap</span>
				</button>
			</div>
		</header>

		<!-- Tampilan Utama (Mainshelf) -->
		<section id="mainshelf" class="mainshelf">
			<!-- Rak buku akan diisi oleh JavaScript -->
		</section>

		<!-- Tampilan List Book -->
		<section id="listbook" class="listbook">
			<div id="listbook-search" class="search-container animated">
				<input type="text" class="search-input" placeholder="Cari buku..." />
				<button class="search-btn">
					<i class="fas fa-search icon"></i>
					<span class="text">Cari</span>
				</button>
			</div>
			<div class="book-grid" id="book-list">
				<!-- Daftar buku akan diisi oleh JavaScript -->
			</div>
		</section>

		<!-- Tampilan Detail Book -->
		<section id="detailbook" class="detailbook">
			<div id="detailbook-search" class="search-container animated">
				<input
					type="text"
					class="search-input"
					placeholder="Cari di dalam buku..." />
				<button class="search-btn">
					<i class="fas fa-search icon"></i>
					<span class="text">Cari</span>
				</button>
			</div>

			<div class="book-content animated" id="book-content">
				<!-- Isi buku akan diisi oleh JavaScript -->
			</div>
			<div id="description-container"></div>
			<div id="pagination-container"></div>
		</section>

		<script src="https://vickyserver.my.id/perpus/helper.js"></script>
		<script src="https://vickyserver.my.id/perpus/script.js"></script>
	</body>
</html>
